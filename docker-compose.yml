version: '3.8'

services:
  edgeguard-federated-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgeguard_iot_fl
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - FL_PORT=8080
      - DEVICE=cpu
    volumes:
      - ./results:/app/results
      - ./deploy/artifacts:/app/deploy/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

